# kitty.conf generated by Confitty on 2026-06-24
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family JetBrains Mono
font_size 12
disable_ligatures cursor

# --- Scrollback ---
scrollback_lines 15000
touch_scroll_multiplier 1.5

# --- Mouse ---
copy_on_select clipboard

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 1pt
active_border_color #FFB5C6
inactive_text_alpha 0.7
confirm_os_window_close 1

# --- Tab Bar ---
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #564D50
active_tab_background #FFB5C6
inactive_tab_foreground #FFFFFF
inactive_tab_background #6B6164
tab_bar_background #564D50

# --- Colors ---
foreground #cccccc
background #0c0c0c
background_opacity 0.97
selection_foreground #ffffff
selection_background #0037da
color0 #0c0c0c
color1 #c50f1f
color2 #13a10e
color3 #c19c00
color4 #0037da
color5 #881798
color6 #3a96dd
color7 #cccccc
color9 #e74856
color10 #16c60c
color11 #f9f1a5
color12 #3b78ff
color13 #b4009e
color14 #61d6d6
color15 #f2f2f2
cursor #FFB5C6
cursor_text_color #564D50
url_color #9DC3CA

